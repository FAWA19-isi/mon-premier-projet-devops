name: CI Script et Conteneur Docker

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t mon-script-github .

      - name: Exécuter le conteneur Docker
        run: docker run --rm mon-script-github
